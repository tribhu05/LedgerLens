[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "1.0.0"
description = "Privacy-First Local AI Bookkeeper & Tax Deduction Engine for Freelancers"
authors = [{ name = "Tribhuwan Singh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
